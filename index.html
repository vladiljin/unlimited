<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Unlimited</title>

    <!-- PWA / App mode -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Unlimited">

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <div class="header">Unlimited</div>

    <div class="card-container">
        <div id="card" class="card">
            <div id="counter" class="counter"></div>
            <div id="content" class="content"></div>
        </div>
    </div>

    <div class="panel-container">
        <div class="floating-panel">
            <button id="btn-left" class="control-btn">←</button>
            <button id="btn-question" class="control-btn">Q</button>
            <button id="btn-answer" class="control-btn">A</button>
            <button id="btn-right" class="control-btn">→</button>
        </div>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
