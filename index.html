<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Unlimited</title>

    <!-- PWA / App mode -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Unlimited">

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <div class="header">
        <span class="title">Unlimited</span>
        <button id="btn-settings" class="settings-btn">🔧</button>
    </div>

    <div id="settings-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" id="close-settings">&times;</span>
            <h2>Settings</h2>
            <div class="setting-group">
                <label for="speed-slider">TTS Speed: <span id="speed-value">1.1</span></label>
                <input type="range" id="speed-slider" min="0.5" max="2" step="0.1" value="1.1">
            </div>
            <div class="setting-group">
                <label for="pitch-slider">TTS Pitch: <span id="pitch-value">0.8</span></label>
                <input type="range" id="pitch-slider" min="0.5" max="2" step="0.1" value="0.8">
            </div>
        </div>
    </div>

    <div class="card-container">
        <div id="card" class="card">
            <div class="top-bar">
                <span id="question-id" class="question-id"></span>
                <span id="counter" class="counter"></span>
            </div>
            <div id="content" class="content"></div>
        </div>
    </div>

    <div class="panel-container">
        <div class="floating-panel">
            <button id="btn-left" class="control-btn">←</button>
            <button id="btn-question" class="control-btn">Q</button>
            <button id="btn-answer" class="control-btn">A</button>
            <button id="btn-right" class="control-btn">→</button>
        </div>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
